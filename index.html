<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Prevents a flash of the wrong theme: runs synchronously before first
      paint, reading the same 'folia-theme' localStorage key the Zustand
      theme store persists to. React's useEffect-based theme application
      runs after the first paint, which is too late to avoid a flash on a
      slow device — this has to happen here, before any stylesheet renders.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('folia-theme');
          var mode = 'system';
          if (stored) {
            var parsed = JSON.parse(stored);
            mode = (parsed.state && parsed.state.mode) || 'system';
          }
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Folia — living design for the home. Considered plants and vessels for modern spaces." />
    <title>Folia — Living design for the home</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
